# Окружение разработчика Pult: PostgreSQL, Samba AD ×2, Mailpit, GreenMail.
#   docker compose -f deploy/compose.dev.yml up -d --build
# Пароли ниже — только для этого тестового окружения; порты открыты только на 127.0.0.1. Не используйте
# этот файл на сервере. Реальные секреты — в .env.local (не в git).
#
# Доступ с машины разработчика:
#   PostgreSQL  localhost:5432   pult / pult-dev
#   LDAPS DC1   dc1.pult.test:6361   LDAPS DC2   dc2.pult.test:6362
#     (добавьте в hosts: 127.0.0.1 dc1.pult.test dc2.pult.test — имя должно совпадать с сертификатом)
#   Mailpit     SMTP localhost:1025, веб http://localhost:8025
#   GreenMail   IMAP localhost:3143, SMTP localhost:3025
# Сертификаты CA контроллеров: deploy/dev/ca/dc1-ca.pem, dc2-ca.pem.

name: pult-dev

x-samba: &samba
  build: ./dev/samba
  privileged: true            # Samba AD требует расширенные атрибуты и ACL файловой системы
  environment: &samba-env
    REALM: PULT.TEST
    DOMAIN: PULT
    ADMIN_PASSWORD: ${PULT_DEV_SAMBA_ADMIN_PASSWORD:-Pult-Admin-2026!}
    DNS_FORWARDER: 1.1.1.1
  volumes:
    - ./dev/ca:/export
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pult
      POSTGRES_USER: pult
      POSTGRES_PASSWORD: ${PULT_DEV_DB_PASSWORD:-pult-dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pult -d pult"]
      interval: 5s
      retries: 20
    networks: [pult]

  samba-dc1:
    <<: *samba
    hostname: dc1
    domainname: pult.test
    environment:
      <<: *samba-env
      ROLE: primary
    volumes: [samba-dc1:/var/lib/samba, ./dev/ca:/export]
    ports: ["127.0.0.1:6361:636", "127.0.0.1:3891:389"]
    networks:
      pult: { ipv4_address: 172.28.0.10 }

  samba-dc2:
    <<: *samba
    hostname: dc2
    domainname: pult.test
    depends_on: [samba-dc1]
    environment:
      <<: *samba-env
      ROLE: replica
      PRIMARY_DC: dc1.pult.test
    dns: [172.28.0.10]          # реплике нужен DNS домена от первого DC
    volumes: [samba-dc2:/var/lib/samba, ./dev/ca:/export]
    ports: ["127.0.0.1:6362:636", "127.0.0.1:3892:389"]
    networks:
      pult: { ipv4_address: 172.28.0.11 }

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    networks: [pult]

  greenmail:
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=helpdesk:helpdesk-dev@pult.test -Dgreenmail.verbose
    ports: ["127.0.0.1:3143:3143", "127.0.0.1:3025:3025"]
    networks: [pult]

volumes:
  pg-data:
  samba-dc1:
  samba-dc2:

networks:
  pult:
    ipam:
      config:
        - subnet: 172.28.0.0/24
