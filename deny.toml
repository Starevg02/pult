# cargo deny check — лицензии, известные уязвимости, источники.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` не сопровождается (не уязвимость): proc-macro времени компиляции, в бинарник не попадает.
  # Приходит через utoipa-axum (макрос routes!). Снять, когда utoipa-axum уйдёт с `paste`.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro paste via utoipa-axum; compile-time only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0", "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # path-зависимости между своими крейтами (publish = false)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
